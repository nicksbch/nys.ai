<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>nexus</title>
<style>
:root {
  color-scheme: light;
  --page: #f9f9f7; --surface: #fcfcfb; --border: rgba(11,11,11,0.10);
  --text: #0b0b0b; --text-2: #52514e; --muted: #7a7974;
  --grid: #e1e0d9; --accent: #2a78d6;
  --good-text: #006300; --critical-text: #b22a2a; --warning-text: #8a5a00;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --page: #0d0d0d; --surface: #1a1a19; --border: rgba(255,255,255,0.10);
    --text: #f0efec; --text-2: #c3c2b7; --muted: #8f8e88;
    --grid: #2c2c2a; --accent: #3987e5;
    --good-text: #0ca30c; --critical-text: #e66767; --warning-text: #fab219;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0d0d0d; --surface: #1a1a19; --border: rgba(255,255,255,0.10);
  --text: #f0efec; --text-2: #c3c2b7; --muted: #8f8e88;
  --grid: #2c2c2a; --accent: #3987e5;
  --good-text: #0ca30c; --critical-text: #e66767; --warning-text: #fab219;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--page); color: var(--text); font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; display: flex; }
aside { width: 250px; flex: none; border-right: 1px solid var(--border); padding: 14px 12px; overflow-y: auto; background: var(--surface); }
aside h1 { font-size: 18px; margin: 0 0 12px; }
aside h2 { font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; margin: 18px 0 6px; }
aside a { display: block; color: var(--text-2); text-decoration: none; padding: 4px 8px; border-radius: 6px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; }
aside a:hover { background: color-mix(in srgb, var(--accent) 8%, transparent); }
aside a.on { background: color-mix(in srgb, var(--accent) 14%, transparent); color: var(--text); }
aside .empty { color: var(--muted); font-size: 13px; padding: 4px 8px; }
#main { flex: 1; display: flex; flex-direction: column; min-width: 0; height: 100%; }
#head { display: flex; align-items: center; gap: 10px; padding: 12px 20px; border-bottom: 1px solid var(--border); min-height: 52px; }
#head .title { font-weight: 600; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#body { flex: 1; overflow-y: auto; }
#thread { max-width: 820px; margin: 0 auto; padding: 20px 20px 40px; }
#composer { border-top: 1px solid var(--border); padding: 12px 20px; }
#composer form { max-width: 820px; margin: 0 auto; display: flex; gap: 8px; align-items: flex-end; }
textarea, select { font: inherit; font-size: 14px; color: var(--text); background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 7px 10px; min-width: 0; }
textarea { flex: 1; resize: none; min-height: 42px; max-height: 200px; }
button { font: inherit; font-size: 13px; color: var(--text); background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 6px 12px; cursor: pointer; white-space: nowrap; }
button:disabled { opacity: .45; cursor: default; }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
button.link { border: none; background: none; color: var(--muted); padding: 2px 4px; }
.user { margin: 22px 0 10px; display: flex; justify-content: flex-end; }
.user div { background: color-mix(in srgb, var(--accent) 12%, var(--surface)); border-radius: 12px; padding: 8px 14px; max-width: 80%; white-space: pre-wrap; overflow-wrap: anywhere; }
.note { margin: 18px 0 0; font-size: 12px; color: var(--muted); white-space: pre-wrap; overflow-wrap: anywhere; border-left: 2px solid var(--grid); padding-left: 10px; }
.answer { margin: 10px 0; overflow-wrap: anywhere; }
.answer p { margin: 0 0 8px; }
.answer ul, .answer ol { margin: 0 0 8px; padding-left: 22px; }
.answer code { font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; background: var(--surface); border: 1px solid var(--border); border-radius: 4px; padding: 0 4px; }
.error { color: var(--critical-text); margin: 10px 0; }
.waiting { color: var(--muted); margin: 10px 0; }
.waiting::after { content: " …"; animation: blink 1.2s infinite; }
@keyframes blink { 50% { opacity: .2; } }
.tool { font-size: 12px; color: var(--muted); margin: 4px 0; }
.tool summary { cursor: pointer; }
.tool pre { font: 11px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 8px; max-height: 240px; overflow: auto; white-space: pre-wrap; overflow-wrap: anywhere; color: var(--text-2); }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; margin: 10px 0; }
.card .what { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 13px; color: var(--text-2); }
.card .what b { color: var(--text); }
.pill { display: inline-block; padding: 1px 8px; border-radius: 10px; font-size: 12px; font-weight: 600; border: 1px solid var(--border); }
.s-proposed, .s-calling, .s-running { color: var(--warning-text); }
.s-done { color: var(--good-text); }
.s-failed { color: var(--critical-text); }
.s-cancelled { color: var(--muted); }
dl { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 2px 12px; margin: 8px 0; font-size: 13px; }
dt { color: var(--text-2); }
dd { margin: 0; overflow-wrap: anywhere; }
.card .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 8px; }
.card .out { margin-top: 6px; overflow-wrap: anywhere; }
.card .out.err { color: var(--critical-text); }
.sub { color: var(--muted); font-size: 13px; }
.mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }
.intro { color: var(--text-2); max-width: 520px; margin: 60px auto; text-align: center; }
@media (max-width: 760px) {
  body { flex-direction: column; }
  aside { width: auto; max-height: 30vh; border-right: none; border-bottom: 1px solid var(--border); }
  #thread, #composer, #head { padding-left: 16px; padding-right: 16px; }
}
</style>
</head>
<body>
<aside>
  <h1>nexus</h1>
  <button class="primary" id="new" style="width:100%">New conversation</button>
  <h2>Conversations</h2>
  <div id="convs"></div>
</aside>
<div id="main">
  <div id="head"></div>
  <div id="body"><div id="thread"></div></div>
  <div id="composer">
    <form id="ask">
      <textarea id="text" rows="1" placeholder="Ask the server to do something…  (Enter to send, Shift+Enter for a new line)"></textarea>
      <button class="primary" id="send">Send</button>
    </form>
  </div>
</div>
<script>
"use strict";
const $ = (s) => document.querySelector(s);
const el = (tag, attrs = {}, ...kids) => {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") e.className = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v);
  }
  for (const k of kids.flat()) if (k != null) e.append(k.nodeType ? k : String(k));
  return e;
};
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);

async function api(method, path, body) {
  const r = await fetch(path, { method, headers: { "Content-Type": "application/json", "X-Nexus": "1" }, body: body === undefined ? undefined : JSON.stringify(body) });
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.error || r.statusText);
  return data;
}

// --- state and routing ----------------------------------------------------------
let current = null; // {id, title}
let calls = new Map(); // tool call id -> {box, call, result} for read-only calls
let cardBoxes = new Map(); // card id -> its element
let models = { models: [], default: "" };
let polling = false;

window.addEventListener("hashchange", route);
async function route() {
  const [kind, id] = location.hash.slice(1).split("/");
  if (kind === "c" && id) return openConv(id);
  current = null;
  showNew();
}

async function refreshSide() {
  const convs = await api("GET", "/api/conversations").catch(() => []);
  $("#convs").replaceChildren(...(convs.length
    ? convs.map((c) => el("a", { href: "#c/" + c.id, title: c.title, class: location.hash === "#c/" + c.id ? "on" : "" }, c.title || "New conversation"))
    : [el("div", { class: "empty" }, "none yet")]));
}

function setHead(...kids) { $("#head").replaceChildren(...kids); }

function showNew() {
  calls = new Map(); cardBoxes = new Map();
  const pick = models.models.length > 1
    ? el("select", { id: "model" }, models.models.map((m) => { const o = el("option", { value: m }, m); if (m === models.default) o.selected = true; return o; }))
    : null;
  setHead(el("span", { class: "title" }, "New conversation"), pick);
  $("#thread").replaceChildren(el("div", { class: "intro" },
    el("p", {}, "Ask the server to do something, such as “get https://…/debian.iso into isos”."),
    el("p", { class: "sub" }, "Anything that changes something is shown as a card first, and only happens when you press Start.")));
  refreshSide();
  $("#text").focus();
}

async function openConv(id) {
  let c;
  try { c = await api("GET", "/api/conversations/" + id); } catch (e) { return showError(e); }
  current = { id, title: c.title };
  calls = new Map(); cardBoxes = new Map();
  convHead(c.title);
  $("#thread").replaceChildren();
  for (const item of c.items) addItem(item);
  refreshSide();
  scrollDown();
  if (c.busy) pollBusy(id);
  if (c.active) pollCards(id);
}

function convHead(title) {
  setHead(el("span", { class: "title" }, title || "New conversation"),
    el("button", { class: "link", title: "Delete this conversation", onclick: deleteConv }, "Delete"));
}

async function deleteConv() {
  if (!confirm("Delete this conversation? Downloads it started carry on.")) return;
  try { await api("DELETE", "/api/conversations/" + current.id); location.hash = ""; } catch (e) { alert(e.message); }
}

async function pollBusy(id) {
  const w = el("div", { class: "waiting" }, "Still answering");
  $("#thread").append(w);
  while (current && current.id === id) {
    await new Promise((r) => setTimeout(r, 3000));
    const c = await api("GET", "/api/conversations/" + id).catch(() => null);
    if (c && !c.busy) { if (current && current.id === id) openConv(id); return; }
  }
}

// pollCards updates the cards on the page while any is calling or running.
async function pollCards(id) {
  if (polling) return;
  polling = true;
  try {
    while (current && current.id === id) {
      await new Promise((r) => setTimeout(r, 2000));
      const c = await api("GET", "/api/conversations/" + id).catch(() => null);
      if (!c || !current || current.id !== id) return;
      for (const item of c.items) if (item.type === "card") updateCard(item.card);
      if (!c.active) return;
    }
  } finally { polling = false; }
}

// addItem shows one event of a conversation, stored or live.
function addItem(item, live) {
  const t = $("#thread");
  switch (item.type) {
    case "user": t.append(el("div", { class: "user" }, el("div", {}, item.text))); break;
    case "note": t.append(el("div", { class: "note" }, "Told the model since your last message:\n" + item.text)); break;
    case "text": { const d = el("div", { class: "answer" }); d.innerHTML = markdown(item.text); t.append(d); break; }
    case "error": t.append(el("div", { class: "error" }, item.text)); break;
    case "card": { const box = el("div"); cardBoxes.set(item.card.id, box); t.append(box); updateCard(item.card); break; }
    case "call": {
      const c = { call: item, result: null, box: el("div") };
      calls.set(item.id, c);
      t.append(c.box);
      renderCall(c);
      break;
    }
    case "result": { const c = calls.get(item.id); if (c) { c.result = item; renderCall(c); } break; }
  }
  if (live) scrollDown();
}

function scrollDown() { const b = $("#body"); b.scrollTop = b.scrollHeight; }
const shortName = (n) => n.replace(/^[a-z0-9-]+__/, "");

// renderCall is a read-only call (or a refused one): a quiet line.
function renderCall(c) {
  const args = JSON.stringify(c.call.args || {});
  const res = c.result;
  const head = `${shortName(c.call.name)} ${args === "{}" ? "" : args}${res ? (res.error ? " · error" : "") : " …"}`;
  c.box.replaceChildren(el("details", { class: "tool" }, el("summary", {}, head),
    res ? el("pre", {}, res.text) : null));
}

// --- cards ------------------------------------------------------------------------
const hints = {
  proposed: "Proposed. Nothing has happened yet.",
  calling: "Starting…",
  running: "Running. This card follows it until it ends.",
  done: "Done.",
  failed: "Failed.",
  cancelled: "Cancelled.",
};

function size(n) {
  if (typeof n !== "number") return "";
  const u = ["B", "KB", "MB", "GB", "TB"];
  let i = 0;
  while (n >= 1000 && i < u.length - 1) { n /= 1000; i++; }
  return (i ? n.toFixed(1) : n) + " " + u[i];
}
function dur(ms) {
  if (typeof ms !== "number") return "";
  if (ms < 60000) return (ms / 1000).toFixed(1) + " s";
  return Math.floor(ms / 60000) + " min " + Math.round((ms % 60000) / 1000) + " s";
}

// outcome sums up a result: a download's object, size and time, or the text.
function outcome(text) {
  let v = null;
  try { v = JSON.parse(text); } catch {}
  if (v && typeof v === "object" && v.bucket && v.key) {
    return [`s3://${v.bucket}/${v.key}`, size(v.bytes), dur(v.duration_ms)].filter(Boolean).join(" · ");
  }
  return text;
}

function updateCard(card) {
  const box = cardBoxes.get(card.id);
  if (!box) return;
  const path = `/api/conversations/${current.id}/cards/${card.id}`;
  const act = async (what, btn) => {
    btn.disabled = true;
    try { updateCard(await api("POST", `${path}/${what}`)); if (what === "start") pollCards(current.id); }
    catch (e) { box.querySelector(".out")?.remove(); box.firstChild.append(el("div", { class: "out err" }, e.message)); btn.disabled = false; }
  };
  const args = Object.entries(card.args || {});
  const buttons = [];
  if (card.state === "proposed" || card.state === "failed") {
    buttons.push(el("button", { class: "primary", onclick: (e) => act("start", e.target) }, card.state === "failed" ? "Start again" : "Start"));
  }
  if (card.state === "proposed") buttons.push(el("button", { onclick: (e) => act("cancel", e.target) }, "Cancel"));
  const job = card.job_run_id ? el("span", { class: "sub" }, "run ", el("span", { class: "mono" }, card.job_run_id)) : null;
  box.replaceChildren(el("div", { class: "card" },
    el("div", { class: "what" }, el("b", {}, shortName(card.tool)), el("span", { class: `pill s-${card.state}` }, card.state), job,
      card.attempts > 1 ? el("span", { class: "sub" }, `started ${card.attempts} times`) : null),
    args.length ? el("dl", {}, args.flatMap(([k, v]) => [el("dt", {}, k), el("dd", {}, typeof v === "string" ? v : JSON.stringify(v))])) : null,
    el("div", { class: "sub" }, card.state === "running" && card.progress ? `Running: ${card.progress}.` : hints[card.state] || ""),
    card.result ? el("div", { class: "out" }, outcome(card.result)) : null,
    card.error ? el("div", { class: "out err" }, card.error) : null,
    buttons.length ? el("div", { class: "row" }, buttons) : null));
}

// --- sending ----------------------------------------------------------------------
$("#text").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); $("#ask").requestSubmit(); }
});
$("#text").addEventListener("input", (e) => { e.target.style.height = "auto"; e.target.style.height = e.target.scrollHeight + 2 + "px"; });
$("#new").addEventListener("click", () => { location.hash = ""; route(); });

$("#ask").addEventListener("submit", async (e) => {
  e.preventDefault();
  const text = $("#text").value.trim();
  if (!text) return;
  $("#send").disabled = true;
  try {
    if (!current) {
      const m = $("#model");
      const c = await api("POST", "/api/conversations", { model: m ? m.value : "" });
      history.replaceState(null, "", "#c/" + c.id);
      current = { id: c.id };
      calls = new Map(); cardBoxes = new Map();
      convHead("");
      $("#thread").replaceChildren();
    }
    $("#text").value = "";
    $("#text").style.height = "auto";
    await send(current.id, text);
  } catch (err) {
    $("#thread").append(el("div", { class: "error" }, err.message));
  } finally {
    $("#send").disabled = false;
  }
});

// send posts a message and shows the turn's events as they arrive.
async function send(id, text) {
  const w = el("div", { class: "waiting" }, "Thinking");
  const r = await fetch("/api/conversations/" + id + "/messages", { method: "POST", headers: { "Content-Type": "application/json", "X-Nexus": "1" }, body: JSON.stringify({ text }) });
  if (!r.ok) { const d = await r.json().catch(() => ({})); throw new Error(d.error || r.statusText); }
  let shownUser = false;
  const showUser = () => { if (!shownUser) { addItem({ type: "user", text }, true); $("#thread").append(w); shownUser = true; } };
  const reader = r.body.getReader();
  const dec = new TextDecoder();
  let buf = "";
  for (;;) {
    const { value, done } = await reader.read();
    if (done) break;
    buf += dec.decode(value, { stream: true });
    let i;
    while ((i = buf.indexOf("\n")) >= 0) {
      const line = buf.slice(0, i);
      buf = buf.slice(i + 1);
      if (!line.trim()) continue;
      const ev = JSON.parse(line);
      if (current && current.id !== id) continue; // the page moved on; the turn still runs
      if (ev.type === "note") { addItem(ev, true); continue; } // comes before the message it goes with
      showUser();
      if (ev.type === "done") { w.remove(); continue; }
      w.remove();
      addItem(ev, true);
      if (ev.type !== "error") $("#thread").append(w);
      scrollDown();
    }
  }
  showUser();
  w.remove();
  refreshSide();
  if (current && current.id === id) {
    const c = await api("GET", "/api/conversations/" + id).catch(() => null);
    if (c) { current.title = c.title; convHead(c.title); }
  }
}

function markdown(src) {
  const inline = (s) => esc(s).replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>");
  const lines = src.replace(/\r/g, "").split("\n");
  let out = "", list = null, para = [];
  const flush = () => { if (para.length) { out += "<p>" + para.map(inline).join("<br>") + "</p>"; para = []; } if (list) { out += `</${list}>`; list = null; } };
  for (const l of lines) {
    const m = /^\s*([-*]|\d+\.)\s+(.*)/.exec(l);
    if (m) {
      const kind = /\d/.test(m[1]) ? "ol" : "ul";
      if (para.length) { const l2 = list; list = null; flush(); list = l2; }
      if (list !== kind) { if (list) out += `</${list}>`; out += `<${kind}>`; list = kind; }
      out += "<li>" + inline(m[2]) + "</li>";
      continue;
    }
    if (!l.trim()) { flush(); continue; }
    if (list) { out += `</${list}>`; list = null; }
    para.push(l);
  }
  flush();
  return out;
}

function showError(e) {
  current = null;
  setHead(el("span", { class: "title" }, "Not found"));
  $("#thread").replaceChildren(el("div", { class: "error" }, e.message));
  refreshSide();
}

api("GET", "/api/models").then((m) => { models = m; }).catch(() => {}).finally(route);
</script>
</body>
</html>
