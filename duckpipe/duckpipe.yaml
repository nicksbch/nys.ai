# duckpipe config. deploy.sh installs it on the server as /etc/duckpipe.yaml:
# change it here and deploy (ONLY=duckpipe ../deploy-all.sh), not on the server.

lake:
  # Where the lake's catalog (table list, schemas, snapshots) is kept:
  #   ducklake:sqlite:/path/catalog.sqlite      one machine; others can read it while duckpipe runs
  #   ducklake:postgres:dbname=lake host=...    query from any machine
  #   ducklake:/path/catalog.ducklake           duckpipe only; nothing else can open it while it runs
  catalog: ducklake:postgres:dbname=ducklake host=127.0.0.1 user=ducklake
  # Where table data is written, as Parquet. Only used when the catalog is
  # first created.
  data_path: s3://lake/
  # Tables are queried as <name>.<schema>.<table>.
  name: lake

# How often to look for new files. "sudo systemctl kill -s HUP duckpipe" polls now.
poll: 30s

maintenance:
  # Merge the small Parquet files that frequent loads create. 0 disables.
  every: 6h
  # Drop snapshots older than this, and the files only they use. Time travel
  # reaches back this far. 0 (or unset) keeps everything.
  keep_snapshots: 720h

pipes:
  # HM Land Registry price paid data (pp-complete.csv, monthly updates): CSV
  # without a header, so the columns are named here. Kept as text; cast later.
  - name: price_paid
    bucket: home
    prefix: uk/price-paid/
    pattern: "*.csv"
    table: uk.price_paid
    options: "header = false, all_varchar = true, names = ['transaction_id', 'price', 'date_of_transfer', 'postcode', 'property_type', 'old_new', 'duration', 'paon', 'saon', 'street', 'locality', 'town_city', 'district', 'county', 'ppd_category_type', 'record_status']"

  # data.police.uk archives, unzipped by preprocessor into
  # uk/crime/extracted/YYYY-MM/YYYY-MM-<force>-<kind>.csv. Each kind has its
  # own columns, so each goes into its own table. The CSVs have a header;
  # normalize_names turns "Crime ID" into crime_id. Kept as text; cast later.
  - name: crime_street
    bucket: home
    prefix: uk/crime/extracted/
    pattern: "*-street.csv"
    table: uk.crime_street
    options: "header = true, all_varchar = true, normalize_names = true"

  - name: crime_outcomes
    bucket: home
    prefix: uk/crime/extracted/
    pattern: "*-outcomes.csv"
    table: uk.crime_outcomes
    options: "header = true, all_varchar = true, normalize_names = true"

  - name: crime_stop_and_search
    bucket: home
    prefix: uk/crime/extracted/
    pattern: "*-stop-and-search.csv"
    table: uk.crime_stop_and_search
    options: "header = true, all_varchar = true, normalize_names = true"
