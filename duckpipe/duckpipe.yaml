# duckpipe config. deploy.sh installs it on the server as /etc/duckpipe.yaml:
# change it here and deploy (ONLY=duckpipe ../deploy-all.sh), not on the server.

lake:
  # Where the lake's catalog (table list, schemas, snapshots) is kept:
  #   ducklake:sqlite:/path/catalog.sqlite      one machine; others can read it while duckpipe runs
  #   ducklake:postgres:dbname=lake host=...    query from any machine
  #   ducklake:/path/catalog.ducklake           duckpipe only; nothing else can open it while it runs
  catalog: ducklake:postgres:dbname=ducklake host=127.0.0.1 user=ducklake
  # Where table data is written, as Parquet. Only used when the catalog is
  # first created.
  data_path: s3://lake/
  # Tables are queried as <name>.<schema>.<table>.
  name: lake

# How often to look for new files. "sudo systemctl kill -s HUP duckpipe" polls now.
poll: 30s

maintenance:
  # Merge the small Parquet files that frequent loads create. 0 disables.
  every: 6h
  # Drop snapshots older than this, and the files only they use. Time travel
  # reaches back this far. 0 (or unset) keeps everything.
  keep_snapshots: 720h

# Every file's records are counted with Go's encoding/csv (without DuckDB),
# and a file whose rows in the table differ fails (README, "Row counts"). So
# a CSV pipe sets header, and delim if it isn't a comma. "stats: false" on a
# pipe turns this off.
pipes:
  # HM Land Registry price paid data (pp-complete.csv, monthly updates): CSV
  # without a header, so the columns are named here. Kept as text; cast later.
  - name: price_paid
    bucket: home
    prefix: uk/price-paid/
    pattern: "*.csv"
    table: uk.price_paid
    options: "header = false, all_varchar = true, names = ['transaction_id', 'price', 'date_of_transfer', 'postcode', 'property_type', 'old_new', 'duration', 'paon', 'saon', 'street', 'locality', 'town_city', 'district', 'county', 'ppd_category_type', 'record_status']"

  # data.police.uk archives, unzipped by preprocessor into
  # uk/crime/extracted/YYYY-MM/YYYY-MM-<force>-<kind>.csv. Each kind has its
  # own columns, so each goes into its own table. The CSVs have a header;
  # normalize_names turns "Crime ID" into crime_id. Kept as text; cast later.
  # The quote is set: in a file with few quoted fields DuckDB's sniffer finds
  # none, and a location like "On or near HIGH ROAD, ICKENHAM" splits in two.
  - name: crime_street
    bucket: home
    prefix: uk/crime/extracted/
    pattern: "*-street.csv"
    table: uk.crime_street
    options: "header = true, all_varchar = true, normalize_names = true, quote = '\"'"

  - name: crime_outcomes
    bucket: home
    prefix: uk/crime/extracted/
    pattern: "*-outcomes.csv"
    table: uk.crime_outcomes
    options: "header = true, all_varchar = true, normalize_names = true, quote = '\"'"

  - name: crime_stop_and_search
    bucket: home
    prefix: uk/crime/extracted/
    pattern: "*-stop-and-search.csv"
    table: uk.crime_stop_and_search
    options: "header = true, all_varchar = true, normalize_names = true, quote = '\"'"

  # ONS Postcode Directory (ONSPD_<MON>_<YYYY>/ONSPD_<MON>_<YYYY>_UK.csv,
  # quarterly): every UK postcode, live and terminated, with the areas it
  # falls in. Each release is a full snapshot that replaces the last. The CSV
  # has a header. Kept as text; cast later. The folder is spelled osnpd.
  - name: onspd
    bucket: home
    prefix: uk/osnpd/
    pattern: "ONSPD_*_UK.csv"
    table: uk.onspd
    options: "header = true, all_varchar = true, normalize_names = true"

  # ONS LSOA (2021) names and codes, one file per country set
  # (LSOA_name_mapping/LSOA (2021) <kind> names and codes <EW|SC|NI> as at
  # <MM_YY>.csv, updated rarely): code, name. Each file's header names the
  # code for its geography (LSOA21CD, Scottish DZ22CD, NI SDZ21CD), so the
  # columns are named here as ONSPD's lsoa21cd column, which holds all three.
  # Some names contain commas, so the quote is set. Kept as text.
  - name: lsoa_names
    bucket: home
    prefix: uk/osnpd/LSOA_name_mapping/
    pattern: "LSOA (2021) *.csv"
    table: uk.lsoa_names
    options: "header = true, all_varchar = true, names = ['lsoa21cd', 'lsoa21nm'], quote = '\"'"

  # ONS MSOA (2021) names and codes, as above (MSOA_name_mapping/MSOA (2021)
  # <kind> names and codes <EW|SC> as at <MM_YY>.csv; Scotland's are IZ22CD):
  # code, name, named as ONSPD's msoa21cd. No NI file. Kept as text.
  - name: msoa_names
    bucket: home
    prefix: uk/osnpd/MSOA_name_mapping/
    pattern: "MSOA (2021) *.csv"
    table: uk.msoa_names
    options: "header = true, all_varchar = true, names = ['msoa21cd', 'msoa21nm'], quote = '\"'"
