[project]
name = "semantic"
version = "0.1.0"
description = "The Boring Semantic Layer over the lake's marts, served as an MCP server over HTTP"
requires-python = ">=3.12"
dependencies = [
    "boring-semantic-layer[mcp]==0.3.18",
    "ibis-framework[duckdb]>=11,<12",
    # Same DuckDB as the CLI that writes the lake (ducklake-setup.sh, lakeshape).
    "duckdb==1.5.6",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false
