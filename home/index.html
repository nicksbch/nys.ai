<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>home</title>
<style>
:root {
  color-scheme: light;
  --page: #f9f9f7; --surface: #fcfcfb; --border: rgba(11,11,11,0.10); --hover: rgba(11,11,11,0.22);
  --text: #0b0b0b; --text-2: #52514e; --muted: #7a7974;
  --good: #0ca30c; --critical: #d03b3b; --unknown: #c3c2b7;
  --critical-text: #b22a2a;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --page: #0d0d0d; --surface: #1a1a19; --border: rgba(255,255,255,0.10); --hover: rgba(255,255,255,0.25);
    --text: #f0efec; --text-2: #c3c2b7; --muted: #8f8e88; --unknown: #383835;
    --critical-text: #e66767;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0d0d0d; --surface: #1a1a19; --border: rgba(255,255,255,0.10); --hover: rgba(255,255,255,0.25);
  --text: #f0efec; --text-2: #c3c2b7; --muted: #8f8e88; --unknown: #383835;
  --critical-text: #e66767;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--page); color: var(--text); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
main { max-width: 900px; margin: 0 auto; padding: 20px 16px 48px; }
header { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
h1 { font-size: 20px; margin: 0; }
.sub { color: var(--muted); font-size: 13px; }
.grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); }
a.card { display: block; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; color: inherit; text-decoration: none; min-width: 0; }
a.card:hover, a.card:focus-visible { border-color: var(--hover); outline: none; }
.name { display: flex; align-items: center; gap: 8px; font-size: 16px; font-weight: 600; }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--unknown); flex: none; }
.up .dot { background: var(--good); }
.down .dot { background: var(--critical); }
.addr { color: var(--text-2); font-size: 13px; margin-top: 4px; overflow-wrap: anywhere; }
.note { color: var(--muted); font-size: 12px; margin-top: 2px; font-variant-numeric: tabular-nums; }
.down .note { color: var(--critical-text); }
</style>
</head>
<body>
<main>
  <header>
    <h1>home</h1>
    <span class="sub" id="sub">checking…</span>
  </header>
  <div class="grid" id="grid"></div>
</main>
<script>
const grid = document.getElementById('grid');
const sub = document.getElementById('sub');
const host = location.hostname.includes(':') ? `[${location.hostname}]` : location.hostname;

function card(s) {
  const url = `${location.protocol}//${host}:${s.port}${s.path}`;
  const a = document.createElement('a');
  a.className = 'card ' + (s.up ? 'up' : 'down');
  a.href = url;
  const name = document.createElement('div');
  name.className = 'name';
  const dot = document.createElement('span');
  dot.className = 'dot';
  name.append(dot, s.name);
  const addr = document.createElement('div');
  addr.className = 'addr';
  addr.textContent = `:${s.port}${s.path === '/' ? '' : s.path}`;
  const note = document.createElement('div');
  note.className = 'note';
  note.textContent = s.up ? `up · ${s.ms} ms` : `down · ${s.error || 'no answer'}`;
  a.append(name, addr, note);
  return a;
}

async function refresh() {
  try {
    const r = await fetch('api/status', {cache: 'no-store'});
    if (!r.ok) throw new Error(r.status);
    const list = await r.json();
    grid.replaceChildren(...list.map(card));
    const down = list.filter(s => !s.up).length;
    sub.textContent = (down ? `${down} of ${list.length} down` : `all ${list.length} up`) +
      ` · ${new Date().toLocaleTimeString()}`;
  } catch (e) {
    sub.textContent = `can't reach home: ${e.message}`;
  }
}

refresh();
setInterval(() => { if (!document.hidden) refresh(); }, 10000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) refresh(); });
</script>
</body>
</html>
