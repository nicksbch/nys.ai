models:
  - name: stg_crime_street
    columns:
      - name: month
        tests: [not_null]
      - name: falls_within
        tests: [not_null]
      - name: crime_type
        tests:
          - not_null
          - accepted_values:
              severity: warn
              values:
                - Anti-social behaviour
                - Bicycle theft
                - Burglary
                - Criminal damage and arson
                - Drugs
                - Other crime
                - Other theft
                - Possession of weapons
                - Public order
                - Robbery
                - Shoplifting
                - Theft from the person
                - Vehicle crime
                - Violence and sexual offences
