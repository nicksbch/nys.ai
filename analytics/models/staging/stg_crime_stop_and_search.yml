models:
  - name: stg_crime_stop_and_search
    columns:
      - name: force
        tests: [not_null]
      - name: searched_at
        tests: [not_null]
      - name: type
        tests:
          - not_null
          - accepted_values: {values: [Person search, Vehicle search, Person and Vehicle search], severity: warn}
      - name: age_range
        tests:
          - accepted_values: {values: [under 10, 10-17, 18-24, 25-34, over 34], severity: warn}
