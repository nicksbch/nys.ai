jobs:
  # Rebuild after duckpipe loads new price paid files.
  - name: price_paid
    select: source:uk.price_paid+
    on:
      - topic: duckpipe.ingest
        type: ok
        data: {table: lake.uk.price_paid}

  # Test the crime staging views and rebuild fct_crime_street after duckpipe
  # loads new data.police.uk files. A new archive brings hundreds of files, so
  # wait for the loads to go quiet.
  - name: crime
    select: source:uk.crime_street+ source:uk.crime_outcomes+ source:uk.crime_stop_and_search+
    on:
      - topic: duckpipe.ingest
        type: ok
        data: {table: lake.uk.crime_street}
      - topic: duckpipe.ingest
        type: ok
        data: {table: lake.uk.crime_outcomes}
      - topic: duckpipe.ingest
        type: ok
        data: {table: lake.uk.crime_stop_and_search}
    debounce: 5m
    max_wait: 1h

  # Test stg_onspd and rebuild the geography dimensions, and fct_crime_street's
  # LSOA mapping, after duckpipe loads a new ONSPD release.
  - name: onspd
    select: source:uk.onspd+
    on:
      - topic: duckpipe.ingest
        type: ok
        data: {table: lake.uk.onspd}

  # Test stg_lsoa_names and stg_msoa_names after duckpipe loads new LSOA or
  # MSOA name files (the views read new rows by themselves). One file per
  # country, so wait for the loads to go quiet.
  - name: area_names
    select: source:uk.lsoa_names+ source:uk.msoa_names+
    on:
      - topic: duckpipe.ingest
        type: ok
        data: {table: lake.uk.lsoa_names}
      - topic: duckpipe.ingest
        type: ok
        data: {table: lake.uk.msoa_names}
    debounce: 5m
    max_wait: 1h
